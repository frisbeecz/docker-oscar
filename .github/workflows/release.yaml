name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tests:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      actions: read

  publish:
    needs: [tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Permissions exist from job start, NOT from the verify step.
    # Only a successful exact-tag reusable workflow reaches this trusted job.
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKER_CONFIG: ${{ github.workspace }}/.venv/docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Download exact same-run static and source evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-sources
          path: artifacts
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: helm-*
          merge-multiple: true
          path: artifacts/chart
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: artifacts/native
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence
          path: artifacts/evidence
          digest-mismatch: error
      - name: Locked Python dependencies, no external writes
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.lock
      - name: Verify everything before first external mutation
        run: .venv/bin/python -m ci.release verify --artifacts artifacts --commit "$GITHUB_SHA"
      - name: Project-local distribution tools
        run: |
          .venv/bin/python -m ci.check --install-tools
          .venv/bin/python -m ci.check --native-tools
          {
            echo "$GITHUB_WORKSPACE/.venv/bin"
            echo "$GITHUB_WORKSPACE/.venv/tools/bin"
          } >> "$GITHUB_PATH"
      - name: Sources first, preserve tested image digests, verify public distribution
        run: python3 -m ci.release publish --artifacts artifacts --commit "$GITHUB_SHA" --registry ghcr.io/frisbeecz
