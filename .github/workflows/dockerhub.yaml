name: Docker Hub maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-maintenance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  migrate:
    if: github.repository == 'frisbeecz/docker-oscar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Locked dependencies and distribution tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-ci.lock
          .venv/bin/python -m ci.check --install-tools
          .venv/bin/python -m ci.check --native-tools
          echo "$GITHUB_WORKSPACE/.venv/tools/bin" >> "$GITHUB_PATH"
      - name: Synchronize metadata and copy the released v1.0.2 image
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .venv/bin/python -m ci.dockerhub migrate-v102
