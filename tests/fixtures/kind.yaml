# Task 3 substitutes OSCAR_CI_RUN_ID (safe lowercase run-id) before kind create.
# Use only on a disposable native GitHub-hosted runner, with --kubeconfig FILE
# and the pinned node image from ci/tools.lock.json. Never use ambient config.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: oscar-ci-OSCAR_CI_RUN_ID
networking:
  apiServerAddress: 127.0.0.1
nodes:
  - role: control-plane
    labels:
      io.docker-oscar.ci-run: OSCAR_CI_RUN_ID
