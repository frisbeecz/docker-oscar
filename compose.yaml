# Local-only Quick Start. See docs/compose.md before using existing data.
services:
  oscar:
    image: ghcr.io/frisbeecz/docker-oscar:2.1.1-r8@sha256:bf0524b3ba21744809c2569a8a770f270c77463d92bbdc96774ba95a87cbfa1a
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: "512m"
    security_opt:
      - no-new-privileges
    cap_drop:
      - NET_RAW
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      PIXELFLUX_WAYLAND: "true"
      HARDEN_DESKTOP: "true"
      START_DOCKER: "false"
      RESTART_APP: "true"
      DISABLE_WINDOW_BUTTONS: "true"
      HARDEN_KEYBINDS: "false"
      DISABLE_MOUSE_BUTTONS: "false"
      SELKIES_FILE_TRANSFERS: "upload,download"
      SELKIES_UI_SIDEBAR_SHOW_FILES: "true"
      FILE_MANAGER_PATH: /config/Uploads
      SELKIES_COMMAND_ENABLED: "false"
      SELKIES_UI_SIDEBAR_SHOW_APPS: "false"
    volumes:
      - type: volume
        source: config
        target: /config
        volume:
          nocopy: true
      - type: volume
        source: data
        target: /config/Documents/OSCAR20_Data
        volume:
          nocopy: true
      - type: volume
        source: sdcard
        target: /config/SDCARD
        read_only: true
        volume:
          nocopy: true

volumes:
  config:
  data:
  sdcard:
