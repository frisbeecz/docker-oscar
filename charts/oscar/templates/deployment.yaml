{{- include "oscar.validateMounts" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oscar.fullname" . }}
  labels:
    {{- include "oscar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "oscar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oscar.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "oscar.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: oscar
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /config/Documents/OSCAR20_Data
            - name: sdcard
              mountPath: /config/SDCARD
              readOnly: {{ .Values.persistence.sdcard.readOnly }}
            - name: shm
              mountPath: /dev/shm
            {{- range .Values.extraPvcMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ if hasKey . "readOnly" }}{{ .readOnly }}{{ else }}true{{ end }}
            {{- end }}
      volumes:
        {{- range $role := list "config" "data" "sdcard" }}
        - name: {{ $role }}
          persistentVolumeClaim:
            claimName: {{ include "oscar.claimName" (dict "root" $ "role" $role) }}
        {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        {{- range .Values.extraPvcMounts }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .claimName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
