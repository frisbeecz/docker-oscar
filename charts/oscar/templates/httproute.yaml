{{- if .Values.gateway.enabled }}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/HTTPRoute") }}
{{- fail "gateway.enabled requires gateway.networking.k8s.io/v1/HTTPRoute; install Gateway API v1 CRDs separately before enabling this route" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "oscar.fullname" . }}
  labels:
    {{- include "oscar.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.path | quote }}
      backendRefs:
        - name: {{ include "oscar.fullname" . }}
          port: 3000
{{- end }}
